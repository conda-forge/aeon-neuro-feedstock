{% set name = "aeon-neuro" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/aeon_neuro-{{ version }}.tar.gz
  sha256: ef85bbb7249787a4e56bfbd9ca357242e026d06dcad98b3ad6028e163071fad9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >61
    - wheel
    - toml
    - python-build
    - pip
  run:
    - python >={{ python_min }},<3.13
    - aeon <0.11.0
    - mne
    - pyprep

test:
  imports:
    - aeon_neuro
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://aeon-neuro.readthedocs.io/
  dev_url: https://github.com/aeon-toolkit/aeon-neuro/
  summary: A package for ECG and EEG time series analysis built on the aeon toolkit.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - griegner
    - MatthewMiddlehurst
